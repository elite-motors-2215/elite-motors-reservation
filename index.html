<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エリートモータース 予約ページ</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
const LIFF_ID = "2011860707-i5lPFvCW";
let lineUserId = "";

async function initLine() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile =
      await liff.getProfile();

    lineUserId = profile.userId;

    console.log(
      "LINEユーザーID:",
      lineUserId
    );

  } catch (error) {

    console.error(
      "LINE初期化エラー:",
      error
    );

  }
}

initLine();
</script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
  background: #f5f7f9;
  color: #333;
}

.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}

.header {
  background: #06c755;
  color: white;
  padding: 22px 18px;
  border-radius: 0 0 18px 18px;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.header p {
  margin: 7px 0 0;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card h2 {
  font-size: 17px;
  margin: 0 0 15px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 7px;
}

.required {
  color: #e53935;
  font-size: 12px;
  margin-left: 5px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  background: #fff;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.form-group {
  margin-bottom: 16px;
}

.radio-group {
  display: grid;
  gap: 9px;
}

.radio-option {
  display: flex;
  align-items: center;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  cursor: pointer;
}

.radio-option input {
  width: auto;
  margin-right: 9px;
}

.time-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.time-option {
  position: relative;
}

.time-option input {
  position: absolute;
  opacity: 0;
}

.time-option label {
  display: block;
  text-align: center;
  padding: 11px 5px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-weight: normal;
  cursor: pointer;
}

.time-option input:checked + label {
  background: #06c755;
  color: white;
  border-color: #06c755;
}

.submit-btn {
  width: 100%;
  border: none;
  background: #06c755;
  color: white;
  padding: 16px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.submit-btn:disabled {
  background: #aaa;
}

.note {
  font-size: 12px;
  color: #777;
  margin-top: 5px;
}

.success {
  display: none;
  text-align: center;
  padding: 30px 15px;
}

.success h2 {
  color: #06c755;
}

.loading {
  display: none;
  text-align: center;
  margin: 15px 0;
}
</style>
</head>

<body>

<div class="header">
  <div class="container">
    <h1>🚗 エリートモータース 予約ページ</h1>
    <p>タイヤ交換・オイル交換のご予約</p>
  </div>
</div>

<div class="container">

<form id="reservationForm">

  <!-- メニュー -->
  <div class="card">
    <h2>① ご希望の作業</h2>

    <div class="form-group">
      <label>メニュー<span class="required">必須</span></label>

      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="menu" value="タイヤ交換" required>
          タイヤ交換
        </label>

        <label class="radio-option">
          <input type="radio" name="menu" value="オイル交換">
          オイル交換
        </label>

        <label class="radio-option">
          <input type="radio" name="menu" value="タイヤ交換・オイル交換">
          タイヤ交換＋オイル交換
        </label>
      </div>
    </div>

    <div class="form-group" id="tireArea">
      <label>タイヤ交換内容</label>

      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="tire" value="夏→冬">
          夏 → 冬
        </label>

        <label class="radio-option">
          <input type="radio" name="tire" value="冬→夏">
          冬 → 夏
        </label>
      </div>
    </div>

    <div class="form-group" id="oilArea">
      <label>オイル交換内容</label>
      <input
        type="text"
        name="oil"
        placeholder="例：エンジンオイル交換"
      >
    </div>
  </div>


  <!-- 車両情報 -->
  <div class="card">
    <h2>② お車について</h2>

    <div class="form-group">
      <label>メーカー<span class="required">必須</span></label>
      <input
        type="text"
        name="maker"
        placeholder="例：トヨタ"
        required
      >
    </div>

    <div class="form-group">
      <label>車種<span class="required">必須</span></label>
      <input
        type="text"
        name="model"
        placeholder="例：プリウス"
        required
      >
    </div>

    <div class="form-group">
      <label>走行距離</label>
      <input
        type="number"
        name="mileage"
        placeholder="例：50000"
      >
      <div class="note">※任意項目です</div>
    </div>

    <div class="form-group">
      <label>ナンバー</label>
      <input
        type="text"
        name="plate"
        placeholder="例：長野300 あ 1234"
      >
      <div class="note">※任意項目です</div>
    </div>
  </div>


  <!-- 希望日時 -->
  <div class="card">
    <h2>③ ご希望日時</h2>

    <p class="note">
      第1希望は必須です。第2・第3希望は任意です。
    </p>

    <!-- 第1希望 -->
    <div class="form-group">
      <label>第1希望日<span class="required">必須</span></label>
      <input type="date" name="d1" required>
    </div>

    <div class="form-group">
      <label>第1希望時間<span class="required">必須</span></label>

      <div class="time-grid">

        <div class="time-option">
          <input type="radio" id="t1_0830" name="t1" value="8:30" required>
          <label for="t1_0830">8:30</label>
        </div>

        <div class="time-option">
          <input type="radio" id="t1_0900" name="t1" value="9:00">
          <label for="t1_0900">9:00</label>
        </div>

        <div class="time-option">
          <input type="radio" id="t1_0930" name="t1" value="9:30">
          <label for="t1_0930">9:30</label>
        </div>

        <div class="time-option">
          <input type="radio" id="t1_1030" name="t1" value="10:30">
          <label for="t1_1030">10:30</label>
        </div>

        <div class="time-option">
          <input type="radio" id="t1_1430" name="t1" value="14:30">
          <label for="t1_1430">14:30</label>
        </div>

        <div class="time-option">
          <input type="radio" id="t1_1530" name="t1" value="15:30">
          <label for="t1_1530">15:30</label>
        </div>

        <div class="time-option">
          <input type="radio" id="t1_1600" name="t1" value="16:00">
          <label for="t1_1600">16:00</label>
        </div>

        <div class="time-option">
          <input type="radio" id="t1_1630" name="t1" value="16:30">
          <label for="t1_1630">16:30</label>
        </div>

      </div>

      <div class="note" id="t1AvailabilityMessage"></div>
    </div>


    <!-- 第2希望 -->
    <div class="form-group">
      <label>第2希望日</label>
      <input type="date" name="d2">
    </div>

    <div class="form-group">
      <label>第2希望時間</label>

      <select name="t2">
        <option value="">選択してください</option>
        <option value="8:30">8:30</option>
        <option value="9:00">9:00</option>
        <option value="9:30">9:30</option>
        <option value="10:30">10:30</option>
        <option value="14:30">14:30</option>
        <option value="15:30">15:30</option>
        <option value="16:00">16:00</option>
        <option value="16:30">16:30</option>
      </select>
    </div>


    <!-- 第3希望 -->
    <div class="form-group">
      <label>第3希望日</label>
      <input type="date" name="d3">
    </div>

    <div class="form-group">
      <label>第3希望時間</label>

      <select name="t3">
        <option value="">選択してください</option>
        <option value="8:30">8:30</option>
        <option value="9:00">9:00</option>
        <option value="9:30">9:30</option>
        <option value="10:30">10:30</option>
        <option value="14:30">14:30</option>
        <option value="15:30">15:30</option>
        <option value="16:00">16:00</option>
        <option value="16:30">16:30</option>
      </select>
    </div>

  </div>


  <!-- お客様情報 -->
  <div class="card">
    <h2>④ お客様情報</h2>

    <div class="form-group">
      <label>お名前<span class="required">必須</span></label>
      <input
        type="text"
        name="name"
        placeholder="例：山田 太郎"
        required
      >
    </div>

    <div class="form-group">
      <label>電話番号<span class="required">必須</span></label>
      <input
        type="tel"
        name="phone"
        placeholder="例：090-1234-5678"
        required
      >
    </div>

    <div class="form-group">
      <label>その他・ご要望</label>
      <textarea
        name="note"
        placeholder="ご質問・ご要望などがあればご記入ください"
      ></textarea>
    </div>
  </div>


  <div class="loading" id="loading">
    予約を送信しています……
  </div>

  <button
    type="submit"
    class="submit-btn"
    id="submitBtn"
  >
    予約する
  </button>

</form>


<!-- 予約完了 -->
<div class="card success" id="success">
  <h2>予約を受け付けました！</h2>

  <p>
    ご予約ありがとうございます。
  </p>

  <p>
    工場で内容を確認後、予約確定となります。
  </p>

  <p>
    しばらくお待ちください。
  </p>
</div>

</div>


<script>

/*
====================================
ここにGASのWebアプリURLを入れる
====================================
*/

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyDZ_PkMGOBg4KX71t-KGr5wvDnDyTLE54e4MeI2M_uIfs0La9U3EDXOI-v-_IVis0u/exec";


/*
====================================
メニューによって入力欄を表示
====================================
*/

const menuRadios =
  document.querySelectorAll('input[name="menu"]');

const tireArea =
  document.getElementById("tireArea");

const oilArea =
  document.getElementById("oilArea");

function updateMenu() {

  const selected =
    document.querySelector('input[name="menu"]:checked');

  if (!selected) return;

  if (
    selected.value === "タイヤ交換" ||
    selected.value === "タイヤ交換・オイル交換"
  ) {
    tireArea.style.display = "block";
  } else {
    tireArea.style.display = "none";
  }

  if (
    selected.value === "オイル交換" ||
    selected.value === "タイヤ交換・オイル交換"
  ) {
    oilArea.style.display = "block";
  } else {
    oilArea.style.display = "none";
  }
}

menuRadios.forEach(function(radio) {
  radio.addEventListener("change", function() {
    updateMenu();
    updateTimeAvailability();
  });
});

updateMenu();



/*
====================================
第1希望時間の空き状況
1枠につき最大2台
====================================
*/

const t1DateInput = document.querySelector('input[name="d1"]');
const t1TimeInputs = document.querySelectorAll('input[name="t1"]');
const t1AvailabilityMessage =
  document.getElementById("t1AvailabilityMessage");

function setTimeLabelStatus(input, text, full, one) {
  const label = document.querySelector('label[for="' + input.id + '"]');
  if (!label) return;

  label.classList.remove("slot-full", "slot-one");

  const oldStatus = label.querySelector(".slot-status");
  if (oldStatus) oldStatus.remove();

  if (full) {
    input.disabled = true;
    input.checked = false;
    label.classList.add("slot-full");
  } else {
    input.disabled = false;
    if (one) label.classList.add("slot-one");
  }

  if (text) {
    const status = document.createElement("span");
    status.className = "slot-status";
    status.textContent = text;
    label.appendChild(status);
  }
}

function resetTimeAvailability() {
  t1TimeInputs.forEach(function(input) {
    input.disabled = false;
    setTimeLabelStatus(input, "", false, false);
  });

  if (t1AvailabilityMessage) {
    t1AvailabilityMessage.textContent = "";
  }
}

async function updateTimeAvailability() {
  const date = t1DateInput ? t1DateInput.value : "";

  if (!date) {
    resetTimeAvailability();
    return;
  }

  const selectedMenu =
    document.querySelector('input[name="menu"]:checked');

  if (
    !selectedMenu ||
    (
      selectedMenu.value !== "タイヤ交換" &&
      selectedMenu.value !== "タイヤ交換・オイル交換"
    )
  ) {
    resetTimeAvailability();
    return;
  }

  try {
    t1TimeInputs.forEach(function(input) {
      input.disabled = true;
    });

    if (t1AvailabilityMessage) {
      t1AvailabilityMessage.textContent =
        "空き状況を確認しています……";
    }

    const results = await Promise.all(
      Array.from(t1TimeInputs).map(async function(input) {
        const url =
          GAS_URL +
          "?action=availability" +
          "&date=" + encodeURIComponent(date) +
          "&time=" + encodeURIComponent(input.value);

        const response = await fetch(url);
        const result = await response.json();

        if (!result.success || !result.availability) {
          throw new Error(
            result.message || "空き状況を取得できませんでした"
          );
        }

        return {
          input: input,
          availability: result.availability
        };
      })
    );

    let fullCount = 0;

    results.forEach(function(item) {
      const a = item.availability;

      if (a.remaining <= 0) {
        fullCount++;
        setTimeLabelStatus(item.input, "予約不可", true, false);
      } else if (a.remaining === 1) {
        setTimeLabelStatus(item.input, "残り1枠", false, true);
      } else {
        setTimeLabelStatus(item.input, "残り2枠", false, false);
      }
    });

    if (t1AvailabilityMessage) {
      t1AvailabilityMessage.textContent =
        fullCount === results.length
          ? "この日は予約枠がすべて埋まっています。別の日を選択してください。"
          : "空き状況は自動更新されます。";
    }

  } catch (error) {
    console.error("予約枠確認エラー:", error);
    resetTimeAvailability();

    if (t1AvailabilityMessage) {
      t1AvailabilityMessage.textContent =
        "空き状況を確認できませんでした。予約送信時に再確認します。";
    }
  }
}

if (t1DateInput) {
  t1DateInput.addEventListener("change", updateTimeAvailability);
}


/*
====================================
予約送信
====================================
*/

document
  .getElementById("reservationForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    if (
      !GAS_URL ||
      GAS_URL.includes("ここにあなたの")
    ) {
      alert(
        "GASのWebアプリURLが設定されていません。\n\nHTML内のGAS_URLを設定してください。"
      );
      return;
    }

    const form =
      new FormData(this);

    // 送信直前にも空き状況を再確認
    try {
      const selectedT1 = form.get("t1") || "";
      const selectedD1 = form.get("d1") || "";

      if (selectedD1 && selectedT1) {
        const availabilityResponse =
          await fetch(
            GAS_URL +
            "?action=availability" +
            "&date=" + encodeURIComponent(selectedD1) +
            "&time=" + encodeURIComponent(selectedT1)
          );

        const availabilityResult =
          await availabilityResponse.json();

        if (
          !availabilityResult.success ||
          !availabilityResult.availability ||
          availabilityResult.availability.remaining <= 0
        ) {
          await updateTimeAvailability();

          throw new Error(
            "申し訳ありません。選択した時間帯は直前に予約がいっぱいになりました。別の時間を選択してください。"
          );
        }
      }

    } catch (availabilityError) {
      console.error(
        "送信前の空き状況確認エラー:",
        availabilityError
      );

      if (
        availabilityError.message &&
        availabilityError.message.includes("直前に予約がいっぱい")
      ) {
        alert(availabilityError.message);
      } else {
        alert(
          "予約枠の空き状況を確認できませんでした。\n\n" +
          "通信状態を確認して、もう一度お試しください。"
        );
      }

      submitBtn.disabled = false;
      loading.style.display = "none";
      return;
    }

    const params =
      new URLSearchParams();

    params.append("action", "create");

    params.append(
      "menu",
      form.get("menu") || ""
    );

    params.append(
      "tire",
      form.get("tire") || ""
    );

    params.append(
      "oil",
      form.get("oil") || ""
    );

    params.append(
      "mileage",
      form.get("mileage") || ""
    );

    params.append(
      "maker",
      form.get("maker") || ""
    );

    params.append(
      "model",
      form.get("model") || ""
    );

    params.append(
      "plate",
      form.get("plate") || ""
    );

    params.append(
      "d1",
      form.get("d1") || ""
    );

    params.append(
      "t1",
      form.get("t1") || ""
    );

    params.append(
      "d2",
      form.get("d2") || ""
    );

    params.append(
      "t2",
      form.get("t2") || ""
    );

    params.append(
      "d3",
      form.get("d3") || ""
    );

    params.append(
      "t3",
      form.get("t3") || ""
    );

    params.append(
      "name",
      form.get("name") || ""
    );

    params.append(
      "phone",
      form.get("phone") || ""
    );

    params.append(
      "note",
      form.get("note") || ""
    );


params.append(
  "lineUserId",
  lineUserId
);

    const submitBtn =
      document.getElementById("submitBtn");

    const loading =
      document.getElementById("loading");

    submitBtn.disabled = true;
    loading.style.display = "block";


    try {

      const response =
        await fetch(
          GAS_URL + "?" + params.toString()
        );

      const result =
  await response.json();

if (result.success === true) {

  document
    .getElementById("reservationForm")
    .style.display = "none";

  loading.style.display = "none";

  document
    .getElementById("success")
    .style.display = "block";

} else {

  throw new Error(
    result.message || "予約登録に失敗しました"
  );

}

    } catch(error) {

      console.error(error);

      alert(
        "予約の送信に失敗しました。\n\n" +
        (error.message || "通信エラーが発生しました。")
      );

      submitBtn.disabled = false;
      loading.style.display = "none";
    }

  });

</script>

</body>
</html>
